<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">Data Lens</title>
  <desc id="description">Read the data, not just the first page. A three-step diagram connects read_file to structure to exact query, with full coverage marked in muted green.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a211a"/>
      <stop offset="1" stop-color="#0c0a08"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#c9a45c" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1200" height="400" rx="16" fill="url(#background)"/>
  <g font-family="sans-serif" fill="#efe4cf">
    <path d="M60 52 H108" stroke="#c9a45c" stroke-width="4"/>
    <text x="60" y="124" font-size="64" font-weight="600" letter-spacing="-1">Data Lens</text>
    <text x="63" y="165" font-size="23">Read the data, not just the first page.</text>
    <g fill="none" stroke="#c9a45c" stroke-width="1.5">
      <rect x="60" y="224" width="280" height="100" rx="10"/>
      <rect x="460" y="224" width="280" height="100" rx="10"/>
      <rect x="860" y="224" width="280" height="100" rx="10"/>
      <path d="M360 274 H438" marker-end="url(#arrow)"/>
      <path d="M760 274 H838" marker-end="url(#arrow)"/>
    </g>
    <g text-anchor="middle" font-size="30">
      <text x="200" y="285" font-family="monospace">read_file</text>
      <text x="600" y="285">structure</text>
      <text x="1000" y="285">exact query</text>
    </g>
    <circle cx="476" cy="357" r="5" fill="#91a383"/>
    <text x="491" y="364" font-size="20" fill="#91a383">full coverage</text>
  </g>
</svg>
